[project]
name = "yt-playlists-downloader"
version = "0.2.0"
description = "Parallel YouTube playlist → MP3 downloader with a brew-style multi-progress dashboard"
requires-python = ">=3.11"
dependencies = [
    # Floor matches what's been validated: the dedup-by-id hook handling assumes
    # the 2026.x progress_hook semantics. Older yt-dlp may fire 'finished' under
    # different conditions.
    "yt-dlp>=2026.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
yt-playlists = "yt_playlists.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yt_playlists"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
