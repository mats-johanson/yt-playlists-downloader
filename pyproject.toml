[project]
name = "yt-playlists-next"
version = "0.3.0"
description = "Spotify-first music library downloader. Discover [DJ]-tagged Spotify playlists, match to YouTube, embed tags + cover art."
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2026.0.0",
    "rich>=13.7.0",
    "spotipy>=2.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
yt-playlists = "yt_playlists.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yt_playlists"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
